[workspace]
resolver = "2"
members = [
    "crates/wxwright-core",
    "crates/wxwright-mp",
    "crates/wxwright-mcp",
    "crates/wxwright-cli",
    "gui/src-tauri",
    "tools/icongen",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YaoIsAI/wxwright"
authors = ["wxwright contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
pulldown-cmark = "0.13"
lol_html = "1.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
dirs = "5"
sha2 = "0.10"
getrandom = "0.2"
sys-locale = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort): the MCP stdio session must survive a per-request panic
# (catch_unwind in wxwright-mcp) instead of dropping the agent's connection.
panic = "unwind"
strip = true
