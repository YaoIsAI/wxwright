name: Release

# Multi-platform build & publish (PRD 12.3 distribution matrix). Two ways:
#   1. Tag push:  git tag v1.0.1 && git push origin v1.0.1
#   2. Actions UI: run "Release" with the version (no v prefix, e.g. 1.0.1).
#      Bump the version in Cargo.toml (+ tauri.conf.json) first - the
#      guard-version job cross-checks the input against Cargo.toml.
# Artifacts land on the GitHub Release of that tag automatically.
#
# Why not a separate tag-cutter workflow: a tag pushed with the workflow's
# own GITHUB_TOKEN fires the push event, but GitHub never lets GITHUB_TOKEN
# events trigger further workflow runs - the release pipeline would silently
# never start (AGENTS.md pitfall 53).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no v prefix, e.g. 0.12.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  GUI_DIR: gui
  # dispatch: v<input>; tag push: the pushed tag name itself
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # ------------------------------------------------------ release version guard
  # Runs for BOTH triggers. A tag push whose tag disagrees with Cargo.toml is a
  # publishing mistake (assets would carry a version nobody asked for), and a
  # skipped job here would silently skip every downstream build as well.
  guard-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check the release version against Cargo.toml
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          echo "Cargo.toml: $VER  release: ${{ env.RELEASE_TAG }}"
          if [ "v$VER" != "${{ env.RELEASE_TAG }}" ]; then
            echo "::error::Version mismatch - Cargo.toml says $VER but ${{ env.RELEASE_TAG }} was requested. Bump the version (Cargo.toml + gui/src-tauri/tauri.conf.json), merge, then tag or dispatch again."
            exit 1
          fi

  # ------------------------------------------------------------ CLI binaries
  build-cli:
    needs: guard-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wxwright-cli-windows-x64.zip
            use_zip: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: wxwright-cli-macos-arm64.tar.gz
            use_zip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: wxwright-cli-macos-x64.tar.gz
            use_zip: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: wxwright-cli-linux-x64.tar.gz
            use_zip: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build deps (libdbus for keyring)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build CLI
        run: cargo build --release --locked -p wxwright-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.use_zip }}" = "true" ]; then
            7z a "../../../${{ matrix.archive }}" wxwright.exe
          else
            tar czf "../../../${{ matrix.archive }}" wxwright
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # ------------------------------------------------------------ GUI bundles
  build-gui:
    needs: guard-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            label: windows
          - os: macos-latest
            bundles: dmg,app
            label: macos
          # Intel build cross-compiled on the ARM runner - same pattern the
          # CLI matrix already uses (macos-latest has no Intel image).
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
            label: macos-intel
          - os: ubuntu-22.04
            bundles: deb,appimage
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Job-level (not step-level) env: step `if` cannot see the step's own env
    # block, so a step-level secret mapping made the sign step's condition
    # always false - configured secrets would have been silently ignored.
    env:
      SIGNING_PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
      # Updater signing (minisign). Both empty = releases still build, but no
      # latest.json is published and in-app updates stay dormant.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps (webkit2gtk et al.)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      # macOS: sign the bundle during `cargo tauri build`. With no identity the
      # bundler skips codesigning entirely (app.rs: `else if let Some(keychain)`),
      # so the shipped .app had no seal at all - only the linker's ad-hoc blob on
      # the bare binary. Gatekeeper on Apple Silicon then reports a quarantined,
      # unsealed bundle as "damaged" with no bypass offered. Identity '-' makes
      # the bundler run `codesign --force -s -` inside-out: the bundle gets a
      # real seal (_CodeSignature/CodeResources) and users get the recoverable
      # "unnotarized developer" dialog instead of "damaged". Full Developer ID
      # notarization activates by adding the APPLE_* secrets (docs/code-signing.md).
      - name: Build GUI bundles (macOS, ad-hoc sealed)
        if: startsWith(matrix.label, 'macos')
        working-directory: ${{ env.GUI_DIR }}
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # empty secrets arrive as set-but-empty env vars, which tauri-bundler
          # treats as configured (var_os() == Some("")); unset them instead
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          # a configured APPLE_ID with a forgotten APPLE_TEAM_ID should fail as
          # MissingTeamId (clear message), not as an empty-arg notarytool error
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          # the Intel entry cross-compiles via its rust target triple; the
          # aarch64 entry builds for the host, so the flag stays empty there
          if [ -n "${{ matrix.target }}" ]; then
            target_args="--target ${{ matrix.target }}"
          else
            target_args=""
          fi
          # updater artifacts (the .app.tar.gz + minisign .sig) only exist when
          # the signing key is configured; the overlay config turns them on
          # without forcing every local `cargo tauri build` to hold the key
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater_config="--config src-tauri/tauri.updater.conf.json"
          else
            echo "::warning title=Updater signing skipped::TAURI_SIGNING_PRIVATE_KEY is not set - this release will not carry updater artifacts."
            updater_config=""
          fi
          cargo tauri build --bundles ${{ matrix.bundles }} $target_args $updater_config -- --locked
          # the cargo workspace shares one target dir at the repo root, while
          # this step's working-directory is gui/ - anchor to the workspace.
          # with a --target triple the bundle lands under target/<triple>/release
          bundle_root="target/release"
          if [ -n "${{ matrix.target }}" ]; then
            bundle_root="target/${{ matrix.target }}/release"
          fi
          app="$GITHUB_WORKSPACE/$bundle_root/bundle/macos/wxwright.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "$app/Contents/_CodeSignature/CodeResources" || {
            echo "::error::app bundle was not sealed (no _CodeSignature/CodeResources)"
            exit 1
          }
          codesign -dvv "$app" 2>&1 | grep -E "Identifier|Signature size" || true
          # the updater archive has no arch in its name, so the two macOS jobs
          # would overwrite each other when artifacts are merged - rename now
          if [ -n "${{ matrix.target }}" ]; then arch=x86_64; else arch=aarch64; fi
          app_tar="$GITHUB_WORKSPACE/$bundle_root/bundle/macos/wxwright.app.tar.gz"
          if [ -f "$app_tar" ]; then
            mv "$app_tar" "${app_tar%.app.tar.gz}_${arch}.app.tar.gz"
            mv "$app_tar.sig" "${app_tar%.app.tar.gz}_${arch}.app.tar.gz.sig"
            echo "renamed updater archive: wxwright_${arch}.app.tar.gz"
          elif [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::updater archive missing - createUpdaterArtifacts did not run"
            exit 1
          fi
      - name: Build GUI bundles (windows/linux)
        if: matrix.label == 'windows' || matrix.label == 'linux'
        working-directory: ${{ env.GUI_DIR }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater_config="--config src-tauri/tauri.updater.conf.json"
          else
            echo "::warning title=Updater signing skipped::TAURI_SIGNING_PRIVATE_KEY is not set - this release will not carry updater artifacts."
            updater_config=""
          fi
          cargo tauri build --bundles ${{ matrix.bundles }} $updater_config -- --locked
      # tauri-bundler signs NSIS/MSI/AppImage/macOS artifacts but not .deb
      # (tauri-bundler/src/bundle/linux/debian.rs has no sign_updaters call).
      # deb-installed clients probe `linux-x86_64-deb`; without a signature the
      # feed composer would either fail or omit the key, so sign it here with
      # the same key the client already pins.
      - name: Sign the deb updater artifact
        if: matrix.label == 'linux' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          deb=$(find target -path '*/release/bundle/deb/*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb found to sign"; exit 1; }
          cargo tauri signer sign "$deb"
          ls -l "$deb.sig"
      - name: Verify updater signatures
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          sigs=$(find target -path '*/release/bundle/*' -name '*.sig' | wc -l)
          echo "updater signatures: $sigs"
          [ "$sigs" -gt 0 ] || {
            echo "::error::updater signing was enabled but no .sig files were produced"
            exit 1
          }
          find target -path '*/release/bundle/*' -name '*.sig' -print
      # Signing is dormant until the maintainer adds the two secrets (see
      # docs/code-signing.md): without them the step skips and the release
      # ships unsigned exactly as before - zero-risk infrastructure-in-waiting.
      - name: Sign Windows installer
        if: matrix.label == 'windows' && env.SIGNING_PFX != ''
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $signtool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          # the cargo workspace shares one target dir at the repo root - the
          # old gui/ working-directory could never see the NSIS bundle
          $bundle = Get-ChildItem "target/release/bundle" -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -match "nsis" } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $bundle) { throw "no installer exe found to sign" }
          & $signtool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          Remove-Item $pfx
          Write-Output "signed: $($bundle.FullName)"
          # Authenticode rewrites the PE, which invalidates the minisign .sig
          # the bundler produced. Regenerate it or every in-app update fails
          # signature verification the day this dormant step is enabled.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            cargo tauri signer sign $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "updater re-sign failed: $LASTEXITCODE" }
            Write-Output "updater signature regenerated after Authenticode"
          }
      - name: Collect bundle artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # host builds land in target/release/bundle; cross builds with a
          # --target triple land in target/<triple>/release/bundle (none exist
          # on runners that did not cross-compile, so skip missing dirs)
          for d in target/release/bundle target/*/release/bundle; do
            [ -d "$d" ] || continue
            find "$d" -type f \
              \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.sig" \) \
              -exec cp {} dist-artifacts/ \;
          done
          # a collection step that finds nothing must fail loudly - the one
          # time this silently produced an empty upload, an entire release
          # shipped without its macOS dmg while every job stayed green
          ls dist-artifacts | grep -q . || {
            echo "::error::no bundles were collected - check the bundle paths above"
            exit 1
          }
          ls -l dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: wxwright-gui-${{ matrix.label }}
          path: dist-artifacts/*

  # ------------------------------------------------------------ publish
  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # only the publish job writes to the repo (creating the Release)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The manifest is the updater's only source of truth: it names one
      # artifact per platform and carries the minisign signature the plugin
      # verifies before installing. No signatures (key not configured) means
      # the script warns and writes nothing, so unsigned releases still ship.
      - name: Compose updater feed (latest.json)
        env:
          # Key rotation escape hatch: the transition release is signed with the
          # OLD key while the app already pins the NEW pubkey, so the default
          # cross-check (signature key id == tauri.conf pubkey) must be pointed
          # at the old key for that one release (docs/auto-update.md).
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          pubkey_arg=()
          if [ -n "$UPDATER_PUBKEY" ]; then pubkey_arg=(--pubkey "$UPDATER_PUBKEY"); fi
          python3 tools/make-latest-json.py \
            --dir artifacts \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --output artifacts/latest.json \
            "${pubkey_arg[@]}"
      # after the feed exists so its hash is covered too
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -not -name "SHA256SUMS.txt" -exec sha256sum {} \; > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag pushes: the pushed tag; dispatch: v<version> - softprops
          # creates the tag from the built commit when it does not exist yet
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/*
      # An update feed that silently failed to attach looks exactly like a
      # healthy release from the app's side - the client would keep reporting
      # "up to date" forever. Assert the asset is really on the release.
      - name: Verify the update feed is attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f artifacts/latest.json ]; then
            echo "No latest.json (updater signing not configured) - in-app updates stay dormant."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[].name' | grep -qx "latest.json" || {
            echo "::error::latest.json was not attached to the release - clients would never see this update"
            exit 1
          }
          echo "latest.json is attached to $RELEASE_TAG"
