[meta]
id = "minimal"
name = "Minimal"
name_zh = "素黑"
author = "wxwright"
license = "MIT"
description = "Content-first minimal: three gray tones, one accent, generous whitespace."
description_zh = "内容即主角：三级灰度字色 + 单一强调色 + 大留白（默认主题）。"
link_style = "footnote"
code_theme = "light"

[colors]
accent = "#2F6CEA"
text = "#1F2328"
text_secondary = "#57606A"
text_tertiary = "#8B949E"
border = "#D8DEE4"
border_strong = "#A8B3BD"
quote_bg = "#F7F8FA"
quote_text = "#57606A"
code_bg = "#F6F8FA"
code_text = "#24292F"
code_border = "#E4E7EC"
inline_code_color = "#C2402A"
table_head_bg = "#F6F8FA"
table_border = "#D8DEE4"
note_bg = "#EFF4FE"
note_border = "#2F6CEA"
tip_bg = "#ECFDF3"
tip_border = "#059669"
important_bg = "#F5F3FF"
important_border = "#7C3AED"
warning_bg = "#FEF3E2"
warning_border = "#D97706"
caution_bg = "#FEF2F2"
caution_border = "#DC2626"
keypoint_bg = "#EFF4FE"
comment_bg = "#FAFBFC"
toc_bg = "#FCFCFD"

[color_dark]
text = "#C9D1D9"
background = "#191919"
accent = "#5B8DEF"
